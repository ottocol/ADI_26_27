<!doctype html>
<html>
	<head>
		<meta charset="utf-8">

		<link rel="stylesheet" href="../../reveal.js-5.2.1/dist/reveal.css">

		<!-- Theme used for syntax highlighting of code -->
		<link rel="stylesheet" href="../../reveal.js-5.2.1/plugin/highlight/zenburn.css">

		<!-- Font awesome is required for the chalkboard plugin -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<!-- Custom controls plugin is used to for opening and closing annotation modes. -->
		<script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/customcontrols/plugin.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/customcontrols/style.css">

		<script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chalkboard/plugin.js"></script>

		<!-- tldraw plugin -->
		<link rel="stylesheet" href="https://unpkg.com/tldreveal/dist/bundle/index.css" />
		<script src="https://unpkg.com/tldreveal/dist/bundle/index.js"></script>
		
</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-markdown="intro_cliente.md"></section>
			</div>
		</div>

		<script src="../../reveal.js-5.2.1/dist/reveal.js"></script>
		<script src="../../reveal.js-5.2.1/plugin/markdown/markdown.js"></script>
		<script src="../../reveal.js-5.2.1/plugin/highlight/highlight.js"></script>
		<script src="../../reveal.js-5.2.1/plugin/zoom/zoom.js"></script>
		<script src="../../reveal.js-5.2.1/plugin/menu/menu.js"></script>
		<script src="../../reveal.js-5.2.1/plugin/notes/notes.js"></script>


		<script>
			// More info about config & dependencies:
			// - https://github.com/hakimel/reveal.js#configuration
			// - https://github.com/hakimel/reveal.js#dependencies
			Reveal.initialize({
				history: true,
				zoomLevel: 1.5,
				plugins: [
					RevealMarkdown, RevealHighlight, RevealZoom, RevealMenu, Tldreveal.Tldreveal() 
				],
				transitionSpeed: 'fast'
			});
			Reveal.configure({ 
				slideNumber: 'c/t'
			});

		</script>
	</body>
